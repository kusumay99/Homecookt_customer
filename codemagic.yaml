workflows:
  homecookt-ios:
    name: HomeCookt Customer iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: homecookt_appstore

    environment:
      node: v24
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.homecookt.homeCookt

    scripts:

      - name: Install npm dependencies
        script: |
          npm ci

      - name: Expo prebuild
        script: |
          npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/HomeCookt Customer.xcworkspace" \
            --scheme "HomeCookt Customer"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log